<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc"><title id="title">A platform developed across systems</title><desc id="desc">Milestones from inspected decisions, Git history and saved checks</desc><rect width="760" height="710" rx="16" fill="#102133"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="29" fill="#ffffff" font-weight="700">A platform developed across systems</text><text x="30" y="77" font-size="19" fill="#c7d5e2">Milestones from inspected decisions, Git history and saved checks</text><rect x="30" y="108" width="700" height="130" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="136" font-size="17" fill="#77dfcd" font-weight="700">MARCH 2026</text><text x="48" y="169" font-size="25" fill="#ffffff" font-weight="700">Architecture continuity</text><text x="48" y="197" font-size="21" fill="#c7d5e2">Recorded decisions, component maps</text><text x="48" y="222" font-size="21" fill="#c7d5e2">and project-context startup procedure.</text><rect x="30" y="253" width="700" height="130" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="281" font-size="17" fill="#77dfcd" font-weight="700">09 OCTOBER 2026</text><text x="48" y="314" font-size="25" fill="#ffffff" font-weight="700">Explicit stages and provenance</text><text x="48" y="342" font-size="21" fill="#c7d5e2">Training / reporting separation;</text><text x="48" y="367" font-size="21" fill="#c7d5e2">evaluation outputs and cost provenance.</text><rect x="30" y="398" width="700" height="130" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="426" font-size="17" fill="#77dfcd" font-weight="700">18 OCTOBER 2026</text><text x="48" y="459" font-size="25" fill="#ffffff" font-weight="700">Integrated historical research</text><text x="48" y="487" font-size="21" fill="#c7d5e2">Historical learning joined with</text><text x="48" y="512" font-size="21" fill="#c7d5e2">explicit unresolved-liquidity contracts.</text><rect x="30" y="543" width="700" height="130" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="571" font-size="17" fill="#77dfcd" font-weight="700">20 OCTOBER 2026</text><text x="48" y="604" font-size="25" fill="#ffffff" font-weight="700">Recovery and consistency acceptance</text><text x="48" y="632" font-size="21" fill="#c7d5e2">Target audit, durable fit completion</text><text x="48" y="657" font-size="21" fill="#c7d5e2">and bounded owner restart evidence.</text></g></svg>
