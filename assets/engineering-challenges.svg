<svg xmlns="http://www.w3.org/2000/svg" width="760" height="785" viewBox="0 0 760 785" role="img" aria-labelledby="title desc"><title id="title">Three difficult problems. Observable results.</title><desc id="desc">Selected private engineering acceptance · 20 October 2026</desc><rect width="760" height="785" rx="16" fill="#102133"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="29" fill="#ffffff" font-weight="700">Three difficult problems. Observable results.</text><text x="30" y="77" font-size="19" fill="#c7d5e2">Selected private engineering acceptance · 20 October 2026</text><rect x="30" y="106" width="700" height="202" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="140" font-size="24" fill="#ffffff" font-weight="700">01  Preserve the meaning of research data</text><text x="48" y="176" font-size="18" fill="#77dfcd" font-weight="700">Problem</text><text x="177" y="176" font-size="18" fill="#c7d5e2">Execution changes can invalidate old labels.</text><text x="48" y="208" font-size="18" fill="#77dfcd" font-weight="700">Solution</text><text x="177" y="208" font-size="18" fill="#c7d5e2">Bind targets to inputs and execution contracts.</text><text x="48" y="240" font-size="18" fill="#77dfcd" font-weight="700">Verification</text><text x="177" y="240" font-size="18" fill="#c7d5e2">Reconcile records and replay control outcomes.</text><text x="48" y="272" font-size="18" fill="#77dfcd" font-weight="700">Result</text><text x="177" y="272" font-size="18" fill="#c7d5e2">Compatible targets; unresolved outcomes retained.</text><rect x="30" y="326" width="700" height="202" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="360" font-size="24" fill="#ffffff" font-weight="700">02  Recover completed model work</text><text x="48" y="396" font-size="18" fill="#77dfcd" font-weight="700">Problem</text><text x="177" y="396" font-size="18" fill="#c7d5e2">Saved output can outlive the completion record.</text><text x="48" y="428" font-size="18" fill="#77dfcd" font-weight="700">Solution</text><text x="177" y="428" font-size="18" fill="#c7d5e2">Separate verified artifacts, receipts and checkpoints.</text><text x="48" y="460" font-size="18" fill="#77dfcd" font-weight="700">Verification</text><text x="177" y="460" font-size="18" fill="#c7d5e2">Inject failures at six fit / save / completion points.</text><text x="48" y="492" font-size="18" fill="#77dfcd" font-weight="700">Result</text><text x="177" y="492" font-size="18" fill="#c7d5e2">Verified work recovered; ambiguous saves stop.</text><rect x="30" y="546" width="700" height="202" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="580" font-size="24" fill="#ffffff" font-weight="700">03  Require evidence before model admission</text><text x="48" y="616" font-size="18" fill="#77dfcd" font-weight="700">Problem</text><text x="177" y="616" font-size="18" fill="#c7d5e2">Training success can coexist with unknown quality.</text><text x="48" y="648" font-size="18" fill="#77dfcd" font-weight="700">Solution</text><text x="177" y="648" font-size="18" fill="#c7d5e2">Separate training, evaluation and authorization.</text><text x="48" y="680" font-size="18" fill="#77dfcd" font-weight="700">Verification</text><text x="177" y="680" font-size="18" fill="#c7d5e2">Test missing, stale and incompatible evidence.</text><text x="48" y="712" font-size="18" fill="#77dfcd" font-weight="700">Result</text><text x="177" y="712" font-size="18" fill="#c7d5e2">Unsupported admission rejected; no auto-activation.</text></g></svg>
