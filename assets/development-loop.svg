<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">How I build with ChatGPT and Codex</title><desc id="desc">I define the goal, discuss options with ChatGPT, ask Codex to build and test, then review reports and decide what comes next.</desc>
<rect width="1120" height="330" rx="18" fill="#101c30"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#58c9c1"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="30" y="39" fill="#ffffff" font-size="22" font-weight="bold">From an idea to a checked result</text>
<rect x="30" y="70" width="235" height="135" rx="10" fill="#20334d" stroke="#3f5877"/>
<text x="45" y="99" fill="#58c9c1" font-size="14">01 / MY IDEA</text>
<text x="45" y="132" fill="#ffffff" font-size="18" font-weight="bold">Me</text>
<text x="45" y="164" fill="#c0cfe0" font-size="12">What should the product do?</text>
<path d="M270 135 H298" stroke="#58c9c1" stroke-width="2" marker-end="url(#a)"/>
<rect x="305" y="70" width="235" height="135" rx="10" fill="#20334d" stroke="#3f5877"/>
<text x="320" y="99" fill="#58c9c1" font-size="14">02 / DISCUSS</text>
<text x="320" y="132" fill="#ffffff" font-size="18" font-weight="bold">ChatGPT</text>
<text x="320" y="164" fill="#c0cfe0" font-size="12">Explore options and define tasks</text>
<path d="M545 135 H573" stroke="#58c9c1" stroke-width="2" marker-end="url(#a)"/>
<rect x="580" y="70" width="235" height="135" rx="10" fill="#20334d" stroke="#3f5877"/>
<text x="595" y="99" fill="#58c9c1" font-size="14">03 / BUILD</text>
<text x="595" y="132" fill="#ffffff" font-size="18" font-weight="bold">Codex</text>
<text x="595" y="164" fill="#c0cfe0" font-size="12">Write code and run checks</text>
<path d="M820 135 H848" stroke="#58c9c1" stroke-width="2" marker-end="url(#a)"/>
<rect x="855" y="70" width="235" height="135" rx="10" fill="#20334d" stroke="#3f5877"/>
<text x="870" y="99" fill="#58c9c1" font-size="14">04 / REVIEW</text>
<text x="870" y="132" fill="#ffffff" font-size="18" font-weight="bold">Me</text>
<text x="870" y="164" fill="#c0cfe0" font-size="12">Read reports and decide next steps</text>
<path d="M970 205 V243 H145 V210" fill="none" stroke="#58c9c1" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="270" fill="#c0cfe0" font-size="14">Improve the task, check again or stop</text>
<text x="30" y="306" fill="#c0cfe0" font-size="13">I manage the work. AI helps create the code. Results need checks.</text></g></svg>