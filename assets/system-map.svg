<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title desc"><title id="title">One connected research system</title><desc id="desc">Historical research workflow · conceptual responsibilities</desc><rect width="760" height="690" rx="16" fill="#102133"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="29" fill="#fff" font-weight="700">One connected research system</text><text x="30" y="77" font-size="19" fill="#c7d5e2">Data, simulation, learning and evidence in a recurring workflow</text><rect x="30" y="115" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="46" y="149" font-size="23" font-weight="700" fill="#fff">01  Historical inputs</text><text x="46" y="184" font-size="20" fill="#c7d5e2">Time-available observations</text><text x="46" y="212" font-size="20" fill="#c7d5e2">Versioned execution rules</text><rect x="405" y="115" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="421" y="149" font-size="23" font-weight="700" fill="#fff">02  Action alternatives</text><text x="421" y="184" font-size="20" fill="#c7d5e2">Native signals + exploration</text><text x="421" y="212" font-size="20" fill="#c7d5e2">Compatible model context</text><rect x="405" y="275" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="421" y="309" font-size="23" font-weight="700" fill="#fff">03  Virtual portfolio</text><text x="421" y="344" font-size="20" fill="#c7d5e2">Capital, positions and costs</text><text x="421" y="372" font-size="20" fill="#c7d5e2">Continuous simulated state</text><rect x="30" y="275" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="46" y="309" font-size="23" font-weight="700" fill="#fff">04  Mature outcomes</text><text x="46" y="344" font-size="20" fill="#c7d5e2">Known / unresolved results</text><text x="46" y="372" font-size="20" fill="#c7d5e2">Time-bound learning targets</text><rect x="30" y="435" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="46" y="469" font-size="23" font-weight="700" fill="#fff">05  Model research</text><text x="46" y="504" font-size="20" fill="#c7d5e2">Entry and management</text><text x="46" y="532" font-size="20" fill="#c7d5e2">Compatible training context</text><rect x="405" y="435" width="325" height="120" rx="10" fill="#1c3449" stroke="#365168"/><text x="421" y="469" font-size="23" font-weight="700" fill="#fff">06  Evidence gate</text><text x="421" y="504" font-size="20" fill="#c7d5e2">Candidate evaluation</text><text x="421" y="532" font-size="20" fill="#c7d5e2">Retain, reject or continue</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#77dfcd"/></marker></defs><path d="M355 175 H396" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><path d="M567 235 V266" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><path d="M405 335 H364" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><path d="M192 395 V426" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><path d="M355 495 H396" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><path d="M730 495 H748 V95 H567 V107" fill="none" stroke="#77dfcd" stroke-width="2" marker-end="url(#a)"/><text x="30" y="592" font-size="20" fill="#77dfcd">Eligible evidence informs the next research cycle.</text><path d="M30 612 H730" stroke="#365168"/><text x="30" y="643" font-size="20" fill="#c7d5e2">Shared: orchestration · identities · receipts · checkpoints</text><text x="30" y="673" font-size="17" fill="#c7d5e2">Conceptual responsibilities; research eligibility is separate from runtime permission.</text></g></svg>
